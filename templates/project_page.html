{% extends "base.html" %}

{% block content %}

<h1 class="title">{{ page.title }}</h1>
<p class="subtitle">
    {{ page.date | date(format="%B %d, %Y") }}
    {% if page.extra.source is defined %}
    - <a href="{{ page.extra.source }}">Sourcecode</a>
    {% endif %}
    {% if page.extra.link is defined %}
    - <a href="{{ page.extra.link }}">Link</a>
    {% endif %}
</p>
<p class="description">{{ page.description }}</p>

<hr>

{{ page.content | safe }}

{% endblock content %}
